name: Atualizar tabelas oficiais

# Todo dia: refaz a extração a partir do repositório público da Receita Federal (CST, cClassTrib,
# alíquotas de referência, NCM) e, se os dados mudaram, abre um pull request com o resumo das
# diferenças e a versão da base registrada no CHANGELOG. Nada é aceito sem revisão humana.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # para disparar o CI no ramo do pull request

concurrency:
  group: atualizar-tabelas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar só as migrações SQL do repositório oficial
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/ReceitaFederal/calculadora-rtc-regime-regular "$RUNNER_TEMP/rtc"
          git -C "$RUNNER_TEMP/rtc" sparse-checkout set flyway
      - name: Gerar tabelas e sincronizar a página e o pacote SQL
        run: |
          python ferramentas/exportar_tabelas.py "$RUNNER_TEMP/rtc"
          python ferramentas/sincronizar_web.py
          python ferramentas/gerar_sql.py --exemplos
      - name: Ver se os dados mudaram
        id: mudou
        run: |
          if python ferramentas/tabelas_mudaram.py; then echo "sim=1" >> "$GITHUB_OUTPUT"; else echo "sim=0" >> "$GITHUB_OUTPUT"; fi
      - name: Testar com as tabelas novas
        if: steps.mudou.outputs.sim == '1'
        run: |
          pip install -e ".[dev]"
          if ! pytest -q; then echo "TESTES_FALHARAM=1" >> "$GITHUB_ENV"; fi
      - name: Abrir pull request com o resumo das diferenças
        if: steps.mudou.outputs.sim == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO=$(python ferramentas/versao_tabelas.py)
          TITULO="Tabelas oficiais: base $VERSAO"
          if [ -n "$(gh pr list --state open --search "\"$TITULO\" in:title" --json number --jq '.[].number')" ]; then
            echo "Já existe um pull request aberto para a base $VERSAO."
            exit 0
          fi
          python ferramentas/resumo_tabelas.py --changelog > resumo.md
          RAMO="tabelas/$(date +%Y%m%d)-$(echo "$VERSAO" | cut -d' ' -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$RAMO"
          git add src/auditor_ibs_cbs/dados docs/tabelas-rtc.json docs/ncm.json sql/ CHANGELOG.md
          git commit -m "data: tabelas oficiais base $VERSAO"
          git push origin "$RAMO"
          {
            echo "Extração automática do repositório público da Receita Federal ([calculadora-rtc-regime-regular](https://github.com/ReceitaFederal/calculadora-rtc-regime-regular))."
            echo
            if [ "${TESTES_FALHARAM:-0}" = "1" ]; then
              echo "> **Atenção:** os testes falharam com a base nova; algum exemplo usa um código que mudou. Revise antes de aceitar."
              echo
            fi
            cat resumo.md
          } > corpo.md
          gh pr create --title "$TITULO" --body-file corpo.md --head "$RAMO"
          # Pull requests abertos com o token do workflow não disparam o CI sozinhos.
          gh workflow run ci.yml --ref "$RAMO"
